name: Build APK
on:
  push:
    branches: [habit-negativi]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: yes | sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Chiave di firma fissa (opzionale)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
          fi
      - run: ./gradlew :uhabits-android:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: loop-negativi-apk
          path: uhabits-android/build/outputs/apk/debug/*.apk
